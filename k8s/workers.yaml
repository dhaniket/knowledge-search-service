apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-outbox
  namespace: knowledge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowledge-outbox
  template:
    metadata:
      labels:
        app: knowledge-outbox
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: outbox
          image: knowledge-search:day9-v1
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - app.workers.outbox_dispatcher
          envFrom:
            - secretRef:
                name: knowledge-env
          env:
            - name: KAFKA_CA_FILE
              value: /run/certs/ca.pem
          volumeMounts:
            - name: aiven-ca
              mountPath: /run/certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: aiven-ca
          secret:
            secretName: aiven-ca

